name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    # Run from the REPO ROOT; point every path explicitly at the subfolder
    env:
      PROJECT_DIR: online-bookstore-flask
      PYTHONPATH: ${{ github.workspace }}/online-bookstore-flask

    steps:
      - name: "Check out code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            online-bookstore-flask/requirements.txt
            online-bookstore-flask/requirements-dev.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r "$PROJECT_DIR/requirements.txt" -r "$PROJECT_DIR/requirements-dev.txt"

      - name: "Debug - show repo files"
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- tracked files under PROJECT_DIR ----"
          git ls-files "$PROJECT_DIR" | sed -n '1,200p'
          echo "---- tests tree ----"
          ls -R "$PROJECT_DIR/tests" || true
          echo "---- pytest version ----"
          pytest --version || true

      - name: "Lint (flake8) — temporarily non-blocking"
        continue-on-error: true
        run: flake8 "$PROJECT_DIR" || true

      - name: "Security scan (Bandit) — non-blocking"
        continue-on-error: true
        run: bandit -r "$PROJECT_DIR/app.py" "$PROJECT_DIR/models.py" -q || true

      # Disable coverage ONLY for this dry-run so it never fails here
      - name: "Debug - pytest collection only (no coverage)"
        continue-on-error: true
        run: pytest -c "$PROJECT_DIR/pytest.ini" --collect-only -q -o addopts="" "$PROJECT_DIR/tests"

      - name: "Unit & integration tests with coverage (85% gate via pytest.ini)"
        run: pytest -c "$PROJECT_DIR/pytest.ini" "$PROJECT_DIR/tests" -m "not perf" --junitxml="$PROJECT_DIR/pytest-results.xml"

      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: online-bookstore-flask/pytest-results.xml

      - name: "Upload coverage data"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: online-bookstore-flask/.coverage*

  perf:
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      PROJECT_DIR: online-bookstore-flask
      PYTHONPATH: ${{ github.workspace }}/online-bookstore-flask

    steps:
      - name: "Check out code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            online-bookstore-flask/requirements.txt
            online-bookstore-flask/requirements-dev.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r "$PROJECT_DIR/requirements.txt" -r "$PROJECT_DIR/requirements-dev.txt"

      - name: "Run performance tests (no coverage, non-blocking)"
        run: pytest -c "$PROJECT_DIR/pytest-perf.ini" -m perf || true
