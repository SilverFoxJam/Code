name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: online-bookstore-flask

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            online-bookstore-flask/requirements.txt
            online-bookstore-flask/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8) — temporarily non-blocking
        continue-on-error: true
        run: flake8 . || true

      - name: Security scan (Bandit) — non-blocking
        run: bandit -r app.py models.py -q || true

      - name: Unit & integration tests with coverage (85% gate via pytest.ini)
        run: pytest -m "not perf" --junitxml=pytest-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: online-bookstore-flask/pytest-results.xml

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: online-bookstore-flask/.coverage*

  perf:
    runs-on: ubuntu-latest
    needs: [lint-test]
    defaults:
      run:
        working-directory: online-bookstore-flask
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            online-bookstore-flask/requirements.txt
            online-bookstore-flask/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run performance tests (no coverage, non-blocking)
        run: pytest -c pytest-perf.ini -m perf || true
